<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyFlow - Tambah Jadwal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-container">
        <h1>DailyFlow</h1>
        <nav>
            <ul>
                <li><a href="Dashboard.html">Dashboard</a></li>
                <li><a href="add.html" class="active">Tambah Jadwal</a></li>
            </ul>
        </nav>
    </div>
</header>
<main class="container">
    <div class="card">
        <h2>Menambahkan Jadwal</h2>
        <form id="formTambah">
            <table>
                <tr>
                    <td><b><label for="name">Nama Jadwal: </label></b></td>
                    <td><input type="text" id="name" name="name" required></td>
                </tr>
                <tr>
                    <td><b><label for="date">Tanggal:</label></b></td>
                    <td><input type="date" id="date" name="date" required></td>
                </tr>
                <tr>
                    <td><b><label for="time">Jam:</label></b></td>
                    <td><input type="time" id="time" name="time" required></td>
                </tr>
                <tr>
                    <td><b><label for="category">Kategori: </label></b></td>
                    <td>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>-- Pilih Kategori --</option>
                            <option value="Kuliah">Kuliah</option>
                            <option value="Tugas">Tugas</option>
                            <option value="Pribadi">Pribadi</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><b><label for="notes">Catatan: </label></b></td>
                    <td><textarea id="notes" name="notes" rows="4" cols="30" placeholder="Tuliskan catatan tambahan di sini..."></textarea></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <button type="submit">Simpan</button>
                        <a href="Dashboard.html" class="btn btn-secondary" style="margin-left: 8px;">Batal</a>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</main>
<footer>
    <p>&copy; 2026 DailyFlow. All rights reserved.</p>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
