<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menambahkan Jadwal - DailyFlow</title>
    <style>
        h1, h2, label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <h1>DailyFlow</h1>
    </header>
    <main>
        <h2>Menambahkan Jadwal</h2>
        <form action="dashboard.html" method="post">
            <!-- Nama Jadwal -->
            <label for="name">Nama Jadwal:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <!-- Tanggal -->
            <label for="date">Tanggal:</label>
            <input type="date" id="date" name="date" required>
            <br><br>

            <!-- Jam / Waktu -->
            <label for="time">Jam:</label>
            <input type="time" id="time" name="time" required>
            <br><br>

            <!-- Kategori (Dropdown) -->
            <label for="category">Kategori:</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>-- Pilih Kategori --</option>
                <option value="Kuliah">Kumpul</option>
                <option value="Tugas">Kerjaaaa</option>
            </select>
            <br><br>

            <!-- Catatan (Textarea) -->
            <label for="notes">Catatan:</label><br>
            <textarea id="notes" name="notes" rows="4" cols="30" placeholder="Tuliskan catatan tambahan di sini..."></textarea>
            <br><br>

            <!-- Tombol Aksi -->
            <button type="submit">Simpan</button>
            <a href="dashboard.html"><button type="button">Batal</button></a>
        </form>
    </main>
</body>
</html>
