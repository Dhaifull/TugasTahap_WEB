<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyFlow - Detail Jadwal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>DailyFlow</h1>
            <nav>
                <ul>
                    <li><a href="Dashboard.html">Dashboard</a></li>
                    <li><a href="add.html">Tambah Jadwal</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <h2>Detail Jadwal</h2>
            <table class="detail-table">
                <tr>
                    <td><strong>Nama Jadwal:</strong></td>
                    <td>Ulang tahun</td>
                </tr>
                <tr>
                    <td><strong>Tanggal:</strong></td>
                    <td>2026-09-30</td>
                </tr>
                <tr>
                    <td><strong>Jam:</strong></td>
                    <td>19:00</td>
                </tr>
                <tr>
                    <td><strong>Kategori:</strong></td>
                    <td><span class="badge">Pribadi</span></td>
                </tr>
                <tr>
                    <td><strong>Catatan:</strong></td>
                    <td>Acara ulang tahun keluarga</td>
                </tr>
            </table>
            <div class="form-actions">
                <a href="Dashboard.html" class="btn btn-secondary">Kembali</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 DailyFlow. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
