<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menambahkan Jadwal</title>
</head>
<body>
    <header>
        <h1>DailyFlow</h1>
    </header>
    <main>
        <h2>Menambahkan Jadwal</h2>
        <form action="dashboard.html" method="post">
            <label for="name">Nama Jadwal:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="date">Tanggal:</label>
            <input type="date" id="date" name="date" required>
            <br><br>

            <label for="time">Jam:</label>
            <input type="time" id="time" name="time" required>
            <br><br>

            <label for="category">Kategori:</label>
            <select id="category" name="category" required>
                <option value="" disabled selected>-- Pilih Kategori --</option>
                <option value="Kuliah">main</option>
                <option value="Tugas">tugas</option>
            </select>
            <br><br>

            <label for="notes">Catatan:</label><br>
            <textarea id="notes" name="notes" rows="4" cols="30" placeholder="Tuliskan catatan tambahan di sini..."></textarea>
            <br><br>

            <button type="submit">Simpan</button>
            <a href="dashboard.html"><button type="button">Batal</button></a>
        </form>
    </main>
</body>
</html>
